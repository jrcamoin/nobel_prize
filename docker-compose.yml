services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antibiotics
      POSTGRES_USER: antibiotics
      POSTGRES_PASSWORD: antibiotics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibiotics"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://antibiotics:antibiotics@db:5432/antibiotics
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      API_WRITE_KEY: ${API_WRITE_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
